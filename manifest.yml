# manifest.yml — the programs this tree can build and run.
#
# Why this file exists: a build script alone is not enough to know what to run.
# Many scripts are shared by several programs that differ only in their
# arguments (one `stdlib/string_bench.build.sh`, twelve `string_bench_*`
# programs), so "run every */*/*.build.sh" tells you nothing about workloads.
# Until now that program list lived only in running-ng's `micro_base.yml`, which
# meant this repo could not check or test itself. scripts/ci-build-all.sh,
# scripts/ci-run-all.sh and scripts/test-runtimes.sh read this file.
#
# `args` are copied VERBATIM from running-ng's `base/ocaml/micro_base.yml` so the
# two can be diffed mechanically — `scripts/ci-manifest.py check --running-ng
# <path>` does exactly that. ${RUNNING_BENCH_DIR} expands to the root of this
# repo, matching running-ng's spelling.
#
# Programs are run from a scratch working directory, so anything a benchmark
# writes relatively (minilight's .ppm) lands there and not in the source tree.
#
# Adding a benchmark: add its entry here in the same commit as its build script,
# and add the matching program to running-ng's micro_base.yml. `check` fails if a
# program here has no build script, or a build script has no program (unless it
# is listed under `disabled`).
#
# `build_script` defaults to <name>.build.sh and is only spelled out when a
# script is shared by several programs.

